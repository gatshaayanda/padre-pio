name: Firebase rules deployment guard (no-op)
# Safety note: FIREBASE_SERVICE_ACCOUNT and FIREBASE_PROJECT_ID are deliberately not read by this workflow.
# This placeholder preserves the foundation repository's static workflow contract without deploying rules.
on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/firebase-rules-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment boundary
        run: echo "Automatic Firebase rules deployment is disabled for this repository reset. No Firebase CLI, secrets, or production services are used."
